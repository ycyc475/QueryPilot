spring:
  application:
    name: querypilot
  datasource:
    url: ${QP_META_DB_URL:jdbc:postgresql://localhost:5432/querypilot_meta}
    username: ${QP_META_DB_USER:qp_meta}
    password: ${QP_META_DB_PASSWORD:qp_meta_pw}
  jpa:
    hibernate:
      ddl-auto: none          # 表结构由 Flyway 管理，Hibernate 不建表
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:querypilot-dev-secret-change-me-0123456789abcdef0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}
  agent:
    base-url: ${QP_AGENT_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
